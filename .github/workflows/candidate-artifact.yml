name: Candidate download

# Test artifacts only. This workflow never creates a tag or a GitHub Release.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    # Do not present artifacts built from a fork as maintainer test candidates.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build wheel and sdist
        run: uv build

      - name: Inspect candidate artifact paths
        shell: bash
        run: python scripts/check_release_artifacts.py dist/*

      - name: Exercise packaged and source installation
        run: python scripts/install_e2e.py --dist-dir dist --source-root .

      - name: Scan source and full available history
        run: uv run python scripts/check_repo_secrets.py --history

      - name: Create checksummed candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          from scripts.check_release_tag import package_version, verify

          root = Path.cwd()
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          source = git("rev-parse", "HEAD")
          if source != os.environ["CANDIDATE_SOURCE_SHA"]:
              raise SystemExit("Candidate source SHA mismatch")
          version = package_version(root)
          verify("v" + version, root)  # Metadata alignment, not tag creation/existence.
          wheels = sorted((root / "dist").glob("*.whl"))
          sdists = sorted((root / "dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("Expected exactly one wheel and one sdist")

          out = root / "candidate-download"
          out.mkdir(exist_ok=False)
          digests = {}
          for path in wheels + sdists:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Candidate artifact must be a regular file")
              target = out / path.name
              shutil.copyfile(path, target)
              digests[target.name] = hashlib.sha256(target.read_bytes()).hexdigest()

          manifest = {
              "artifact_kind": "test-candidate-not-a-release",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": source,
              "source_tree": git("rev-parse", "HEAD^{tree}"),
              "package_version": version,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "build_platform": platform.platform(),
              "build_python": platform.python_version(),
              "build_uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "files_sha256": digests,
              "acceptance_note": (
                  "This workflow checks package paths, local packaged/source installation "
                  "and source/history secrets. Separately require the full CI and Docs "
                  "checks for this candidate before use. Live Windows onboarding, "
                  "provider authorization, restart/recovery and stable release publication "
                  "are not established by this artifact."
              ),
          }
          manifest_path = out / "CANDIDATE.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          sums = dict(digests)
          sums[manifest_path.name] = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          checksums = "".join(f"{digest}  {name}\n" for name, digest in sorted(sums.items()))
          (out / "SHA256SUMS.txt").write_text(checksums, encoding="utf-8")
          summary = (
              "## Candidate download — not a stable release\n\n"
              f"Source commit: `{source}`\n\n"
              f"Source tree: `{manifest['source_tree']}`\n\n"
              f"Package version: `{version}`\n\n"
              "Wait for the separate full CI and Docs checks before testing. "
              "A candidate download does not authorize publication.\n\n"
              "SHA-256 checksums of the extracted files (not the outer download ZIP):\n\n"
              "```text\n" + checksums + "```\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          print(summary)
          PY

      - name: Retain candidate for manual clean-machine testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reasonfirst-candidate-${{ env.CANDIDATE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: candidate-download/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
