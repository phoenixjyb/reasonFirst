name: CI

on:
  push:
    branches: [main, v0.2.0-dev, v0.2.1-cross-platform, v0.3.0-dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve dependencies
        run: uv sync

      - name: Verify packaged CLIs
        run: |
          uv run actual-coder --help
          uv run actual-coder doctor --help
          uv run codingagent --help
          uv run gitlab-agent --help

      - name: Compile Python sources
        run: uv run python -m compileall -q server.py smoke_test.py src/gitlab_agent tests

      - name: Run v0.2 local workflow tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run v4 bridge regression bundle
        shell: bash
        run: |
          set -euo pipefail
          V4="tools/reasonfirst_v4_0_3"
          export RF_V4_RUNTIME_DIR="$RUNNER_TEMP/reasonfirst-v4-runtime"
          bash "$V4/install_v4_runtime.sh"
          PY="$RF_V4_RUNTIME_DIR/.venv/bin/python"
          export PYTHONPATH="$PWD/src:$PWD/$V4"
          for script in "$V4"/tests/test_*.py; do
            echo "== $script =="
            "$PY" "$script"
          done
          for script in "$V4"/tests/test_*.sh; do
            echo "== $script =="
            bash "$script"
          done
          for script in "$V4"/*.sh; do
            bash -n "$script"
          done

      - name: Enforce zero OpenAI model API usage in project code
        shell: bash
        run: |
          ! grep -R --include='*.py' -E '(^|[[:space:]])(from[[:space:]]+openai|import[[:space:]]+openai)|api\.openai\.com/v1' .
          ! grep -Ei '^[[:space:]]*"openai([<=>~!]|")' pyproject.toml

      - name: Scan tracked files and Git history for secrets
        run: |
          test ! -f .env
          uv run python scripts/check_repo_secrets.py --history


  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve dependencies
        run: uv sync

      - name: Verify packaged CLIs
        run: |
          uv run actual-coder --help
          uv run actual-coder doctor --help
          uv run gitlab-agent --help

      - name: Compile Python sources
        run: uv run python -m compileall -q server.py smoke_test.py src/gitlab_agent tests

      - name: Parse native Windows PowerShell scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw .\scripts\install_user.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\run_mcp.ps1)) | Out-Null

      - name: Run workflow tests
        run: uv run python -m unittest discover -s tests -v
