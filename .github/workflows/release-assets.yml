name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_ID: ${{ github.event.release.id }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout immutable event source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Verify release tag matches package/runtime version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_tag.py "$RELEASE_TAG"

      - name: Test release bundle and collision guards
        run: python -m unittest discover -s tests -p test_release_bundle.py -v

      - name: Build wheel and sdist
        run: uv build --no-create-gitignore

      - name: Inspect release artifacts
        run: python scripts/check_release_artifacts.py dist/*

      - name: Exercise packaged and source install routes
        run: python scripts/install_e2e.py --dist-dir dist --source-root .

      - name: Re-run source/history secret scan
        run: |
          uv sync
          uv run python scripts/check_repo_secrets.py --history

      - name: Generate pinned Homebrew formula
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          SOURCE_URL="https://github.com/${REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          curl --fail --location --retry 5 --output /tmp/reasonfirst-source.tar.gz "$SOURCE_URL"
          SHA256="$(sha256sum /tmp/reasonfirst-source.tar.gz | awk '{print $1}')"
          python scripts/render_homebrew_formula.py \
            --version "$VERSION" \
            --source-url "$SOURCE_URL" \
            --sha256 "$SHA256" \
            --output dist/reasonfirst.rb
          ruby -c dist/reasonfirst.rb

      - name: Stage public checksums and source/build manifest
        run: |
          python scripts/release_bundle.py stage \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cat release-download/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release identity and refuse existing target assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --hostname github.com \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          gh api --hostname github.com --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > "$RUNNER_TEMP/release-assets.json"
          REMOTE_SHA="$(gh api --hostname github.com \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          python scripts/release_bundle.py check-upload \
            --release-json "$RUNNER_TEMP/release.json" \
            --assets-json "$RUNNER_TEMP/release-assets.json" \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --remote-sha "$REMOTE_SHA"

      - name: Attach validated install artifacts without replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-download/* --repo "$GITHUB_REPOSITORY"
