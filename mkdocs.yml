site_name: ReasonFirst
site_description: ChatGPT-first reasoning, worker-execution coding orchestration
site_url: https://phoenixjyb.github.io/reasonFirst/
repo_url: https://github.com/phoenixjyb/reasonFirst
repo_name: phoenixjyb/reasonFirst
edit_uri: edit/main/

docs_dir: .site-src
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phoenixjyb/reasonFirst
      name: ReasonFirst on GitHub

nav:
  - Home: index.md
  - Start here:
      - Install & update: docs/INSTALL.md
      - First 10 minutes: first-10-minutes.md
      - Mental model: concepts.md
      - Detailed/manual setup: docs/GETTING_STARTED.md
      - Practice lab: docs/PRACTICE_LAB.md
      - Fully chat-based E2E: docs/CHAT_ONLY_PRACTICE.md
      - FAQ: faq.md
  - Use ReasonFirst:
      - Working with ChatGPT: chatgpt-workflow.md
      - Daily workflow: docs/WORKFLOW.md
      - Evidence & review: evidence-review.md
      - Worker / CLI setup: docs/ACTUAL_CODER_QUICKSTART.md
      - Troubleshooting: docs/TROUBLESHOOTING.md
  - Operate & understand:
      - Tunnel lifecycle: docs/TUNNEL_LIFECYCLE.md
      - Project access: docs/PROJECT_ACCESS.md
      - Architecture: docs/ARCHITECTURE.md
      - Security: SECURITY.md
      - Design philosophy: docs/DESIGN_PHILOSOPHY.md
      - Runtime TLS: docs/HTTPS_API_TLS.md
