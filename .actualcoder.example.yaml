# Example repository-local ActualCoder contract.
#
# Copy this file to .actualcoder.yaml in the target GitLab repository.
# Replace the sample Python/pytest validation with that project's real commands.
# Repository-owned configuration cannot grant itself new executable permissions.
# Each executable must already be approved by GITLAB_ALLOWED_EXECUTABLES.

version: 1

project:
  base_branch: main

# Supported backend names: codex (Codex CLI), copilot (Copilot CLI),
# codex-desktop (managed Codex Desktop App Server). Order is preference order.
agents:
  preferred:
    - codex
    - copilot

validation:
  commands:
    - name: unit-tests
      argv:
        - uv
        - run
        - pytest
        - -q
      required: true
      timeout_seconds: 300

# The high-level finish workflow enforces these paths using its base-commit
# policy. Low-level commit/push commands do not run the full finish gate.
# .actualcoder.yaml is also a built-in protected path in finish.
protected_paths:
  - .gitlab-ci.yml
  - deploy/

instructions:
  - Prefer the repository's existing architecture and coding conventions.
  - Keep changes scoped to the stated task.

# Does NOT expand the user's executable allowlist. An approved interpreter
# still runs repository code on the host; this is not a sandbox.
executables:
  required:
    - uv

mr:
  target_branch: main
  title_prefix: ""
