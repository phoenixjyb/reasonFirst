[project]
name = "chatgpt-selfhosted-gitlab-mcp"
version = "0.5.1"
description = "ReasonFirst: reasoning-first coding orchestration with ActualCoder, coding-agent backends, and a read-only GitLab MCP bridge"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2,<3",
  "httpx>=0.27,<1",
  "certifi>=2024.2.2",
  "PyYAML>=6,<7",
]

[project.scripts]
reasonfirst = "gitlab_agent.reasonfirst_cli:main"
reasonfirst-gitlab-mcp = "gitlab_agent.read_mcp:main"
reasonfirst-bridge-mcp = "gitlab_agent.bridge_mcp:main"
reasonfirst-bridge-http = "gitlab_agent.bridge_http:main"
gitlab-agent = "gitlab_agent.cli:main"
actual-coder = "gitlab_agent.actual_coder_cli:main"
codingagent = "gitlab_agent.codingagent_cli:main"
actual-coder-migrate-https = "gitlab_agent.https_migration:main"
actual-coder-check-project = "gitlab_agent.project_access:main"
actual-coder-tunnel = "gitlab_agent.tunnel_lifecycle:main"

[dependency-groups]
dev = ["cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_agent"]
